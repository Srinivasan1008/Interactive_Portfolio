        extend: {

            sans: ['Inter', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace']

  <link rel="preconnect" href="https://fonts.googleapis.com">

      background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),

    }
    #gameCanvas { touch-action: none; -webkit-tap-highlight-color: transparent; }
    .pure-art-frame {
      position: relative; width: 100%; height: 380px; overflow: hidden;
      border-radius: 16px; background: #0d0e14; border: 1px solid #1f2330;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .pure-art-frame iframe, .pure-art-frame .instagram-media {
      position: absolute !important; top: -54px !important; left: 0 !important;
      width: 100% !important; min-width: 100% !important; border: none !important;
    }
    .art-click-overlay { position: absolute; inset: 0; z-index: 20; cursor: pointer; }
