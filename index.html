<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Srinivasan Venkatesan | Senior Full Stack Developer & Artist</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#090a0f',
              card: '#111218',
              cardHover: '#181a24',
              border: '#1f2330',
              subtle: '#2a3044'
            },
            accent: {
              DEFAULT: '#10b981',
              dim: 'rgba(16, 185, 129, 0.15)',
              bright: '#34d399'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #08090d;
      color: #e2e8f0;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }
    ::selection {
      background: #10b981;
      color: #000;
    }
    .grid-bg {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
    
    /* Touch handling for pure mobile responsive gaming */
    #gameCanvas {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* PURE ARTWORK ISOLATION: Clips top profile bar & bottom CTA buttons */
    .pure-art-frame {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 16px;
      background: #0d0e14;
      border: 1px solid #1f2330;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .pure-art-frame iframe,
    .pure-art-frame .instagram-media {
      position: absolute !important;
      top: -54px !important; /* Conceals profile header completely */
      left: 0 !important;
      width: 100% !important;
      min-width: 100% !important;
      border: none !important;
    }
    .art-click-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      cursor: pointer;
    }
  </style>
</head>
